apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: three-tier-app
  labels:
    tags.datadoghq.com/env: lab
    tags.datadoghq.com/service: three-tier-api
    tags.datadoghq.com/version: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
        tags.datadoghq.com/env: lab
        tags.datadoghq.com/service: three-tier-api
        tags.datadoghq.com/version: v2
      annotations:
        ad.datadoghq.com/api-server.logs: >-
          [{"source":"python","service":"three-tier-api"}]
    spec:
      containers:
        - name: api-server
          image: three-tier-api:simulator-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']

            - name: DD_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']

            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']

            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

            - name: DD_TRACE_AGENT_PORT
              value: "8126"

            - name: DD_DOGSTATSD_PORT
              value: "8125"

            - name: DD_LOGS_INJECTION
              value: "true"

            - name: DD_TRACE_SAMPLE_RATE
              value: "1.0"

            - name: DD_RUNTIME_METRICS_ENABLED
              value: "true"

            - name: SLOW_MIN_SECONDS
              value: "0.8"

            - name: SLOW_MAX_SECONDS
              value: "1.8"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
